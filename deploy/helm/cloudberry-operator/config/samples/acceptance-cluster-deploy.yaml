# =============================================================================
# Acceptance Cluster Deploy — Scenario 93 + S3 Backup (Vault credentials)
# =============================================================================
# Full acceptance-test cluster combining:
#   - Scenario 93: Multi-Server PXF + HA + Vault PKI + Monitoring
#   - Scenario 71 backup block: S3 destination with Vault-sourced credentials
#
# Components:
#   - DB image cloudberry-official-pxf:2.2.0 (pxf + pxf_fdw extensions)
#   - HA coordinator with standby
#   - 2 segments with mirroring (group layout)
#   - Vault PKI TLS (auth.ssl)
#   - Vault KV secrets
#   - Query monitoring: postgres-exporter on segments+mirrors+coordinator
#     + cloudberry-query-exporter
#   - PXF sidecar with 6 servers (s3, hdfs, jdbc×2, hive, hbase)
#   - S3 backup to MinIO via Vault-materialized credentials
#   - deletionPolicy Retain
# =============================================================================
apiVersion: avsoft.io/v1alpha1
kind: CloudberryCluster
metadata:
  name: acceptance-test
  namespace: cloudberry-test
  labels:
    app.kubernetes.io/managed-by: cloudberry-operator
    scenario: "93"
spec:
  version: "2.2.0"
  image: "cloudberry-official-pxf:2.2.0"
  imagePullPolicy: IfNotPresent

  coordinator:
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        # 1 Gi: 512 Mi OOMKilled the coordinator during in-pod gpbackup
        # report finalization (U018 F-1, exit 137) — marginal for ≥100 MB
        # payloads under amd64 emulation. Requests unchanged.
        memory: "1Gi"
    storage:
      size: "2Gi"

  standby:
    enabled: true
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    storage:
      size: "2Gi"

  segments:
    count: 2
    primariesPerHost: 2
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        # 1 Gi: 512 Mi OOMKilled a segment primary during restore COPY of
        # line_items (U018 F-2) and U023 perf hits the same envelope
        # (960k-row COPY + WAL + mirror sync). Requests unchanged.
        memory: "1Gi"
    storage:
      size: "2Gi"
    mirroring:
      enabled: true
      layout: group
    antiAffinity: preferred

  auth:
    basic:
      enabled: true
      adminUser: gpadmin
    ssl:
      enabled: true
      certSecret:
        name: acceptance-test-tls
      minTLSVersion: "1.2"
    oidc:
      enabled: true
      issuerURL: "http://host.docker.internal:8090/realms/test"
      clientID: "cloudberry-operator"
      clientSecret:
        secretRef:
          name: oidc-client-secret
          key: client-secret
      scopes:
        - openid
        - profile
        - email
      roleClaimPath: "realm_access.roles"
      roleClaimSource: id_token
      roleMatchMode: exact
      roleMapping:
        admin: Admin
        user: Basic
        reader: "Self Only"
      pkce: true
      allowLocalSignIn: true
    hbaRules:
      - type: local
        database: all
        user: gpadmin
        method: trust
      - type: host
        database: all
        user: all
        address: "0.0.0.0/0"
        method: scram-sha-256

  # Cluster-wide GUCs — rendered verbatim into the operator-managed
  # postgresql.conf ConfigMap, so they are in effect from first pod start.
  config:
    parameters:
      # Force the TCP interconnect for this acceptance environment. Cloudberry's
      # default interconnect (udpifc) rides on UDP, which is unreliable under
      # kind / Docker Desktop networking (the vpnkit/VM NAT path drops or
      # reorders UDP between pod sandboxes) — Motion traffic between segments
      # then stalls until gp_interconnect_setup_timeout even though the
      # NetworkPolicy admits it. TCP survives that environment.
      # NOTE: gp_interconnect_type is applied from postgresql.conf at server
      # start; changing it on a RUNNING cluster needs a pod restart to take
      # effect (the operator classifies it as a config change but cannot
      # hot-reload postmaster-scoped interconnect settings).
      gp_interconnect_type: tcp

  ha:
    ftsProbeInterval: 60
    ftsProbeTimeout: 20
    ftsProbeRetries: 5

  vault:
    enabled: true
    address: "http://host.docker.internal:8200"
    authMethod: kubernetes
    authPath: "auth/kubernetes"
    role: "cloudberry-operator"
    secretPath: "secret/data/cloudberry"

  queryMonitoring:
    enabled: true
    guestAccess: false
    historyRetention: "30d"
    samplingInterval: 6
    planCollection: true
    slowQueryThreshold: "1000ms"
    exporters:
      postgresExporter:
        enabled: true
        image: "prometheuscommunity/postgres-exporter:v0.16.0"
        port: 9187
        segments: true
        mirrors: true
      cloudberryQueryExporter:
        enabled: true
        image: "cloudberry-query-exporter:1.0.0"
        port: 9188

  monitoring:
    enabled: true
    metricsPort: 9187
    serviceMonitor: false

  dataLoading:
    enabled: true
    pxf:
      enabled: true
      image: "cloudberry-pxf:2.2.0"
      # Docker-desktop amd64 emulation note: the PXF Spring Boot context needs
      # ~75-90 s of emulated JIT work to reach /actuator/health, which brushes
      # the operator's fixed 154 s startup-probe budget. TieredStopAtLevel=1
      # removes most C2 JIT compilation from the boot path (the dominant cost
      # under Rosetta-off emulation); steady-state throughput is acceptable for
      # a test-env sidecar. Heap sized for 6 low-traffic servers.
      jvmOpts: "-Xms128m -Xmx768m -XX:TieredStopAtLevel=1"
      port: 5888
      logLevel: INFO
      extensions:
        pxf: true
        pxfFdw: true
      servers:
        - name: s3-datalake
          type: s3
          config:
            fs.s3a.endpoint: "http://minio:9000"
            fs.s3a.path.style.access: "true"
          credentialSecrets:
            - name: backup-s3-credentials
              key: aws_access_key_id
            - name: backup-s3-credentials
              key: aws_secret_access_key
        - name: hadoop-cluster
          type: hdfs
          config:
            fs.defaultFS: "hdfs://namenode:8020"
            dfs.replication: "1"
          hive:
            hive.metastore.uris: "thrift://hive-metastore:9083"
          hbase:
            hbase.zookeeper.quorum: "hbase:2181"
        - name: mysql-oltp
          type: jdbc
          config:
            jdbc.driver: "com.mysql.cj.jdbc.Driver"
            jdbc.url: "jdbc:mysql://mysql:3306/oltp"
          credentialSecrets:
            - name: mysql-credentials
              key: username
            - name: mysql-credentials
              key: password
        - name: postgres-source
          type: jdbc
          config:
            jdbc.driver: "org.postgresql.Driver"
            jdbc.url: "jdbc:postgresql://pgsource:5432/sourcedb"
          credentialSecrets:
            - name: pg-source-credentials
              key: username
            - name: pg-source-credentials
              key: password
        - name: hive-warehouse
          type: hive
          config:
            fs.defaultFS: "hdfs://namenode:8020"
            hive.metastore.uris: "thrift://hive-metastore:9083"
        - name: hbase-store
          type: hbase
          config:
            fs.defaultFS: "hdfs://namenode:8020"
            hbase.zookeeper.quorum: "hbase:2181"
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          # 1 CPU for the PXF sidecar: JVM boot under amd64 emulation is
          # JIT-bound; 500m made the startup probe budget marginal.
          cpu: "1"
          memory: "1Gi"
    jobs:
      - name: s3-csv-load
        type: pxf
        enabled: true
        pxfJob:
          server: s3-datalake
          profile: "s3:text"
          # loadMethod fdw: the s3:text CSV dataset is comma-delimited; the FDW
          # path maps the text profile to the csv format (scenario103's
          # s3-fdw-load pattern, same server/profile/resource). Kept on fdw
          # deliberately for FDW-path parity with scenario103 — the
          # external-table read path is FIXED since DEF-1 (U027:
          # PXFReadFormatClause("s3:text") now emits FORMAT 'CSV'; live-proven
          # by the U019 7-format matrix and scenario99 read-back), so either
          # loadMethod works for this dataset.
          loadMethod: fdw
          resource: "cloudberry-data/text/data.csv"
          targetTable: "public.pxf_loaded"

  # S3 Backup with Vault-sourced credentials (from scenario71)
  backup:
    enabled: true
    schedule: "0 2 * * *"
    image: "cloudberry-backup:2.2.0"
    retention:
      fullCount: 3
      incrementalCount: 10
      maxAge: "30d"
    destination:
      type: s3
      s3:
        bucket: cloudberry-backups
        endpoint: "http://minio:9000"
        region: us-east-1
        folder: /backups
        encryption: "on"
        forcePathStyle: true
        vaultSecret:
          path: "secret/cloudberry/backup-s3"
          accessKeyField: aws_access_key_id
          secretKeyField: aws_secret_access_key
        multipart:
          backupMaxConcurrentRequests: 4
          backupMultipartChunksize: "10MB"
          restoreMaxConcurrentRequests: 4
          restoreMultipartChunksize: "10MB"

  deletionPolicy: Retain

apiVersion: avsoft.io/v1alpha1
kind: CloudberryCluster
metadata:
  name: cloudberry-affinity-full
  namespace: cloudberry-test
  labels:
    app.kubernetes.io/managed-by: cloudberry-operator
spec:
  version: "16"
  image: "postgres:16"
  imagePullPolicy: IfNotPresent

  coordinator:
    replicas: 1
    port: 5432
    storage:
      size: "5Gi"

  # Standby coordinator with dedicated tolerations. The tolerations flow through
  # to the standby pod template; with affinity.mode=full the standby also gains a
  # coordinator anti-affinity term so it lands off the coordinator's node.
  standby:
    enabled: true
    storage:
      size: "5Gi"
    tolerations:
      - key: "cloudberry.io/standby"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

  segments:
    count: 2
    primariesPerHost: 1
    antiAffinity: preferred
    mirroring:
      enabled: true
      layout: group
    storage:
      size: "5Gi"

  # affinity.mode=full composes all three cross-role anti-affinity terms:
  #   * segment primary <-> mirror   (always best-effort / preferred)
  #   * standby         <-> coordinator (honors type below)
  #   * backup Job pod  <-> coordinator (honors type below)
  #
  # type=required makes the coordinator<->standby and coordinator<->backup terms
  # hard (each targets the single coordinator pod, so required is safe). The
  # segment primary<->mirror term stays preferred regardless (the webhook emits a
  # non-fatal warning explaining this).
  affinity:
    mode: full
    type: required
    topologyKey: kubernetes.io/hostname

  backup:
    enabled: false
    schedule: "0 2 * * *"
    destination:
      type: s3
      bucket: cloudberry-backups
      endpoint: "http://minio:9000"
      forcePathStyle: true
      credentialSecret:
        name: minio-credentials

  deletionPolicy: Retain

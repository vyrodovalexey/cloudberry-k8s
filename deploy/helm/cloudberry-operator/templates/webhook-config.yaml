{{- if .Values.webhook.enabled -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "cloudberry-operator.fullname" . }}-validating
  labels:
    {{- include "cloudberry-operator.labels" . | nindent 4 }}
webhooks:
  - name: validate.cloudberrycluster.avsoft.io
    admissionReviewVersions:
      - v1
    clientConfig:
      {{- /*
      caBundle is intentionally OMITTED when webhook.caBundle is empty:
      an empty caBundle is non-functional anyway, and the operator always
      injects the real bundle at startup and on every cert rotation
      (certmanager.injectCABundle, both self-signed and vault-pki sources).
      With Helm 4 server-side apply, rendering `caBundle: ""` makes Helm
      claim ownership of the field and upgrade conflicts with the
      operator's injected value (field-manager conflict on upgrade).
      */}}
      {{- if .Values.webhook.caBundle }}
      caBundle: {{ .Values.webhook.caBundle | b64enc }}
      {{- end }}
      service:
        name: {{ include "cloudberry-operator.webhookServiceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate-avsoft-io-v1alpha1-cloudberrycluster
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    rules:
      - apiGroups:
          - avsoft.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - cloudberryclusters
    sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "cloudberry-operator.fullname" . }}-mutating
  labels:
    {{- include "cloudberry-operator.labels" . | nindent 4 }}
webhooks:
  - name: mutate.cloudberrycluster.avsoft.io
    admissionReviewVersions:
      - v1
    clientConfig:
      {{- if .Values.webhook.caBundle }}
      caBundle: {{ .Values.webhook.caBundle | b64enc }}
      {{- end }}
      service:
        name: {{ include "cloudberry-operator.webhookServiceName" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate-avsoft-io-v1alpha1-cloudberrycluster
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    rules:
      - apiGroups:
          - avsoft.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - cloudberryclusters
    sideEffects: None
{{- end }}

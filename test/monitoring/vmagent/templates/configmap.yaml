apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vmagent.fullname" . }}
  labels:
    {{- include "vmagent.labels" . | nindent 4 }}
data:
  scrape.yml: |
    global:
      scrape_interval: {{ .Values.scrapeConfig.scrapeInterval }}

    scrape_configs:
      - job_name: 'kubernetes-pods'
        # Preserve a scraped target's own `job` label (e.g. the operator's
        # cloudberry_data_loading_job_status{job=<load-job>}); without this the
        # scrape `job=kubernetes-pods` collides and the metric label is renamed
        # to `exported_job`, breaking dashboards/PromQL that use {job}.
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          # Copy annotation port to __tmp_port for comparison
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            target_label: __tmp_port
          # Copy container port number to __tmp_container_port
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            target_label: __tmp_container_port
          # When annotation port is set, keep only matching container port
          - if: '{__tmp_port!=""}'
            source_labels: [__tmp_port, __tmp_container_port]
            action: keep_if_equal
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: replace
            target_label: component

      # -----------------------------------------------------------------
      # Cloudberry Query Exporter (port 9188 on coordinator pods)
      # -----------------------------------------------------------------
      # The coordinator pod annotation prometheus.io/port=9187 targets the
      # postgres-exporter sidecar. The query-exporter sidecar on :9188 is
      # not covered by that annotation, so this SEPARATE job selects pods
      # by the query-exporter container port (9188) plus the
      # prometheus.io/scrape=true annotation.
      #
      # NOTE (DEF-5 adjudication, 2026-11-15, spec 12): a former
      # `pxf-actuator` job here scraped the PXF sidecar actuator on :5888
      # cross-pod; SE.5 (BuildPXFClusterNetworkPolicy) intentionally blocks
      # cross-pod ingress to :5888, so that job could only ever produce
      # down targets and was REMOVED. Zero PXF/Micrometer series in
      # VictoriaMetrics is the EXPECTED steady state; the actuator stays
      # enabled for same-pod (loopback) diagnostics. Do not re-add without
      # an explicit SE.5 exception decision in spec 12.
      - job_name: 'cloudberry-query-exporter'
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Keep only pods with the query-exporter container port (9188).
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9188"
          # Keep only pods that have prometheus.io/scrape=true.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          # Override the scrape address to use port 9188.
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:9188
            target_label: __address__
          # Standard metadata labels.
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: replace
            target_label: component

      - job_name: 'kubernetes-service-endpoints'
        # Preserve a scraped target's own `job` label (avoid exported_job).
        honor_labels: true
        kubernetes_sd_configs:
          - role: endpointslice
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          # Copy annotation port to __tmp_port for comparison
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_port]
            target_label: __tmp_port
          # Copy endpointslice port to __tmp_ep_port
          - source_labels: [__meta_kubernetes_endpointslice_port]
            target_label: __tmp_ep_port
          # When annotation port is set, keep only matching endpointslice port
          - if: '{__tmp_port!=""}'
            source_labels: [__tmp_port, __tmp_ep_port]
            action: keep_if_equal
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: service
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
